<div class="container mt-5">
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-body text-center p-5">
      <i class="bi bi-envelope-x-fill text-danger" style="font-size: 3rem;"></i>
      <h2 class="mt-3">Cancelar Assinatura</h2>

      <div *ngIf="!carregando && !sucesso && !erro">
        <p class="text-muted mt-2">
          Tem certeza de que deseja cancelar sua assinatura do Jornal do Condomínio?
        </p>

        <button class="btn btn-danger mt-3 px-4" (click)="cancelarAssinatura()">
          <i class="bi bi-x-circle me-2"></i> Cancelar Assinatura
        </button>
      </div>

      <div *ngIf="carregando" class="mt-3">
        <div class="spinner-border text-secondary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="text-muted mt-2">Processando cancelamento...</p>
      </div>

      <div *ngIf="sucesso" class="alert alert-success mt-4">
        <i class="bi bi-check-circle-fill me-2"></i>
        Sua assinatura foi cancelada com sucesso.
      </div>

      <div *ngIf="erro" class="alert alert-danger mt-4">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        Ocorreu um erro ao cancelar sua assinatura. Tente novamente mais tarde.
      </div>
    </div>
  </div>
</div>
